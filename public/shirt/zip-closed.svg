<svg xmlns="http://www.w3.org/2000/svg" width="36" height="40" viewBox="0 0 36 40">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#e3e6ec"/><stop offset=".7" stop-color="#b4bac6"/><stop offset="1" stop-color="#8b92a1"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1a9a"/><stop offset=".5" stop-color="#0a1458"/><stop offset="1" stop-color="#0a1a9a"/>
    </linearGradient>
  </defs>
  <rect width="36" height="40" fill="url(#tape)"/>
  <path d="M2 0v40M34 0v40" stroke="#e8ebff" stroke-width="1" stroke-dasharray="4 3" opacity=".75"/>
  <rect x="17.4" y="0" width="1.2" height="40" fill="#020632" opacity=".85"/>
  <!-- left teeth, reaching right -->
  <rect x="5" y="2.5" width="14" height="8" rx="2.4" fill="url(#steel)" stroke="#6e7584" stroke-width=".7"/>
  <rect x="5" y="22.5" width="14" height="8" rx="2.4" fill="url(#steel)" stroke="#6e7584" stroke-width=".7"/>
  <rect x="7" y="3.5" width="10" height="1.6" rx=".8" fill="#fff" opacity=".85"/>
  <rect x="7" y="23.5" width="10" height="1.6" rx=".8" fill="#fff" opacity=".85"/>
  <!-- right teeth, offset half a pitch, reaching left -->
  <rect x="17" y="12.5" width="14" height="8" rx="2.4" fill="url(#steel)" stroke="#6e7584" stroke-width=".7"/>
  <rect x="17" y="32.5" width="14" height="8" rx="2.4" fill="url(#steel)" stroke="#6e7584" stroke-width=".7"/>
  <rect x="19" y="13.5" width="10" height="1.6" rx=".8" fill="#fff" opacity=".85"/>
  <rect x="19" y="33.5" width="10" height="1.6" rx=".8" fill="#fff" opacity=".85"/>
  <rect x="17" y="-7.5" width="14" height="8" rx="2.4" fill="url(#steel)" stroke="#6e7584" stroke-width=".7"/>
</svg>
