<svg xmlns="http://www.w3.org/2000/svg" width="100" height="236" viewBox="0 0 100 236">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a909e"/><stop offset=".35" stop-color="#f1f3f7"/><stop offset=".6" stop-color="#c3c8d2"/><stop offset="1" stop-color="#7d8493"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ff8a"/><stop offset=".45" stop-color="#d7ff3f"/><stop offset="1" stop-color="#a9d900"/>
    </linearGradient>
    <linearGradient id="limeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3a5200" stop-opacity=".45"/>
    </linearGradient>
    <mask id="star">
      <rect width="100" height="236" fill="#fff"/>
      <path d="M50 142 C52 154 56 158 68 160 C56 162 52 166 50 178 C48 166 44 162 32 160 C44 158 48 154 50 142Z" fill="#000"/>
    </mask>
    <filter id="drop" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000a40" flood-opacity=".45"/></filter>
  </defs>
  <g filter="url(#drop)">
    <!-- slider head: wide at the top where the teeth leave, narrow where the chain enters -->
    <path d="M8 22 C8 8 22 2 50 2 C78 2 92 8 92 22 C92 34 78 44 66 50 L66 56 L34 56 L34 50 C22 44 8 34 8 22Z" fill="url(#steel)" stroke="#6a717f" stroke-width="1.2"/>
    <path d="M8 22 C8 8 22 2 50 2 C78 2 92 8 92 22 C92 34 78 44 66 50 L66 56 L34 56 L34 50 C22 44 8 34 8 22Z" fill="url(#steelV)"/>
    <rect x="40" y="8" width="20" height="46" rx="4" fill="url(#steel)" stroke="#6a717f" stroke-width="1"/>
    <rect x="43" y="10" width="5" height="40" rx="2.5" fill="#fff" opacity=".7"/>
    <!-- lime bail -->
    <path d="M34 54 L34 76 C34 82 38 84 42 84 L58 84 C62 84 66 82 66 76 L66 54" fill="none" stroke="url(#lime)" stroke-width="9" stroke-linejoin="round"/>
    <path d="M37 56 L37 76" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
    <!-- pull -->
    <g mask="url(#star)">
      <path d="M26 92 C26 86 32 82 40 82 L60 82 C68 82 74 86 74 92 L82 190 C83 214 70 232 50 232 C30 232 17 214 18 190Z" fill="url(#lime)" stroke="#8fb800" stroke-width="1.2"/>
      <path d="M26 92 C26 86 32 82 40 82 L60 82 C68 82 74 86 74 92 L82 190 C83 214 70 232 50 232 C30 232 17 214 18 190Z" fill="url(#limeShade)"/>
      <ellipse cx="38" cy="120" rx="9" ry="30" fill="#fff" opacity=".32" transform="rotate(5 38 120)"/>
    </g>
  </g>
</svg>
